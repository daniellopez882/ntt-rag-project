services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-vector_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Not published on the host by default; add a port mapping in an override
    # file if you need psql from outside the network.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vector_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      - "${APP_PORT:-8058}:8058"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      args:
        EXTRAS: "--extra ui"
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0
    env_file: .env
    environment:
      API_URL: http://api:8058
    ports:
      - "${SERVER_PORT:-8501}:8501"
    depends_on:
      - api
    restart: unless-stopped

  # Run on demand: docker compose run --rm ingest --documents documents
  ingest:
    build:
      context: .
      args:
        EXTRAS: "--extra ingest"
    entrypoint: ["python", "-m", "ingestion.ingest"]
    env_file: .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./documents:/app/documents:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["ingest"]

volumes:
  postgres_data:
    driver: local
