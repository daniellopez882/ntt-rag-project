name: CI

on:
  push:
    branches: [main, production-readiness]
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy agent

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Unit tests (no database, no OpenAI, no Docling)
        run: uv run pytest -q
      - name: Importing the API needs no secrets
        run: |
          env -u OPENAI_API_KEY -u API_KEY uv run python -c "import agent.api, ingestion.ingest_cli_check" 2>/dev/null \
            || env -u OPENAI_API_KEY -u API_KEY uv run python -c "import agent.api"

  ingest-tests:
    # The ingestion extra pulls Docling and a CPU-only torch; kept in its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra ingest
      - run: uv run pytest -q tests/test_ingestion.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run bandit -q -r agent ingestion ui
      - run: uv export --no-dev --no-hashes -o /tmp/req.txt && uv run pip-audit -r /tmp/req.txt
      - name: No .env tracked
        run: test -z "$(git ls-files | grep -E '(^|/)\.env$')"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ntt-rag-api:ci .
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id ntt-rag-api:ci -u)" = "10001"
      - name: Starts against pgvector, migrates, fails closed without a key, serves with one
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=ci-password
          API_KEY=ci-api-key
          EOF
          docker compose up -d postgres
          docker compose build api
          docker compose up -d api
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8058/health >/dev/null 2>&1 && break; sleep 3; done
          curl -fsS http://127.0.0.1:8058/health | tee health.json
          grep -q '"database":true' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8058/documents)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-api-key' http://127.0.0.1:8058/documents)" = "200"
          docker compose logs api | tail -20
          docker compose down -v
