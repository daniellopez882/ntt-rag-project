[project]
name = "ntt-rag-project"
version = "0.2.0"
description = "An agentic RAG API over PostgreSQL/pgvector: Pydantic AI, FastAPI, Docling ingestion, Streamlit UI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# The API's own needs. Docling (and the torch stack) is only for ingestion;
# it used to be installed into every image, including the API's.
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",           # starlette >= 1.1 needs a recent FastAPI
    "starlette>=1.1.0",           # PYSEC-2026-2280, PYSEC-2026-2281
    "idna>=3.15",                 # PYSEC-2026-215
    "requests>=2.33.0",           # PYSEC-2026-2275
    "urllib3>=2.7.0",             # PYSEC-2026-141, -1994, -1996, -1998

    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.4",
    "pydantic-ai-slim[openai]>=1.56.0,<2",  # PYSEC-2026-2980
    "click>=8.3.3",               # PYSEC-2026-2132
    "openai>=1.101.0",
    "python-dotenv>=1.2.2",       # PYSEC-2026-2270
    "httpx>=0.28.1",
    "anyio>=4.10.0",
]

[project.optional-dependencies]
ingest = [
    "docling>=2.48.0",
    "langchain-core>=0.3.75",
    "langchain-text-splitters>=0.3.9",
    "langchain-experimental>=0.3.4",
    "langchain-openai>=0.3.32",
    "huggingface-hub[hf-xet]>=0.34.4",
]
ui = [
    "streamlit>=1.49.0",
    "requests>=2.32",
    "aiohttp>=3.10",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "ingestion", "ui"]

# CPU-only torch for the ingestion extra; the default index resolves the
# multi-gigabyte CUDA build on Linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".venv312"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
